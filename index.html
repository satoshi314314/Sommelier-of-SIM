<style>
/* Layout: ワインリスト。上に「本日の一杯」、下に番付順の回線リスト。1カラム・iPhone幅基準 */
:root{
  --bg:#f3eef0; --surface:#ffffff; --sunk:#ebe3e6; --fg:#2a1820; --muted:#7f6871; --line:#e2d7db;
  --wine:#7a2240; --wine-ink:#fbf3f5; --gold:#a8822e; --track:#eadfe3;
  --ok:#2f7d57; --warn:#b67812; --bad:#b83a3a;
  --c-rakuten:#b8336a; --c-ahamo:#2f8f55; --c-ymobile:#d04545; --c-uq:#2b74b8; --c-other:#7a8796;
  --font-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#160e12; --surface:#211519; --sunk:#1b1115; --fg:#f2e7eb; --muted:#a8929b; --line:#33232a;
  --wine:#8e2c4c; --wine-ink:#fbeff3; --gold:#d8b35e; --track:#352630;
  --ok:#62c48f; --warn:#e5ad48; --bad:#ee7a72;
  --c-rakuten:#e46b9c; --c-ahamo:#66c487; --c-ymobile:#ef7c7c; --c-uq:#6aaee6; --c-other:#9aa6b4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#160e12; --surface:#211519; --sunk:#1b1115; --fg:#f2e7eb; --muted:#a8929b; --line:#33232a;
  --wine:#8e2c4c; --wine-ink:#fbeff3; --gold:#d8b35e; --track:#352630;
  --ok:#62c48f; --warn:#e5ad48; --bad:#ee7a72;
  --c-rakuten:#e46b9c; --c-ahamo:#66c487; --c-ymobile:#ef7c7c; --c-uq:#6aaee6; --c-other:#9aa6b4;
  color-scheme:dark}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

header{display:flex;align-items:center;gap:10px}
header img{width:34px;height:34px;border-radius:9px;flex:none}
header .t{flex:1;min-width:0}
h1{font-family:var(--font-display);font-weight:800;font-size:21px;margin:0;letter-spacing:.06em;line-height:1.2}
.month{font-size:12px;color:var(--muted);letter-spacing:.02em}
.icon-btn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.icon-btn svg{width:18px;height:18px}

.month-bar{height:3px;border-radius:2px;background:var(--track);overflow:hidden}
.month-bar i{display:block;height:100%;background:var(--gold)}

/* 本日の一杯 */
.pick{background:var(--wine);color:var(--wine-ink);border-radius:18px;padding:16px 18px 14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.pick::after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.pick .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--wine-ink);opacity:.75;font-weight:700}
.pick .name{font-family:var(--font-display);font-weight:800;font-size:24px;line-height:1.25}
.pick .why{font-size:13px;color:var(--wine-ink);opacity:.9;line-height:1.55}.pick .why b{color:inherit;font-weight:700}
.pick .go{align-self:flex-start;margin-top:6px;display:inline-flex;align-items:center;gap:6px;background:var(--wine-ink);color:var(--wine);font-weight:700;font-size:13px;padding:7px 14px;border-radius:999px;text-decoration:none}

.stats3{display:flex;justify-content:space-between;gap:8px;padding:0 4px}
.stats3 div{display:flex;flex-direction:column;min-width:0}
.stats3 b{font-family:var(--font-display);font-size:20px;font-weight:800;line-height:1.2}
.stats3 b small{font-family:var(--font-body);font-size:11px;font-weight:500;margin-left:2px;color:var(--muted)}
.stats3 span{font-size:11px;color:var(--muted)}

.listhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.listhead h2{font-family:var(--font-display);font-size:15px;margin:0;letter-spacing:.12em;font-weight:800}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{padding:5px 12px;border-radius:999px;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.note{font-size:12px;color:var(--muted);padding:8px 12px;border-radius:12px;background:var(--sunk)}

/* 回線カード */
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border-radius:16px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:9px;border:1px solid var(--line)}
.row1{display:flex;align-items:flex-start;gap:10px}
.rank{flex:none;width:30px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.1;color:var(--muted)}
.rank small{display:block;font-size:9px;letter-spacing:.1em;font-family:var(--font-body);font-weight:500}
.rank.first{color:var(--gold)}
.who{flex:1;min-width:0}
.who .n{font-weight:700;font-size:15.5px;overflow-wrap:anywhere}
.who .c{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.pill{flex:none;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)}
.why{font-size:12.5px;color:var(--muted);line-height:1.55}
.why b{color:var(--fg);font-weight:500}
.usage{display:flex;align-items:baseline;gap:6px}
.big{font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1}
.big.empty{color:var(--muted)}
.of{font-size:13px;color:var(--muted)}
.meter{position:relative;height:6px;background:var(--track);border-radius:3px;margin-top:2px}
.fill{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--ok)}
.fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;margin-left:-1px;background:var(--gold);border-radius:1px}
.tick{position:absolute;top:0;bottom:0;width:2px;background:var(--surface)}
.scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);position:relative;height:14px}
.scale span{position:absolute;transform:translateX(-50%)}
.scale span:first-child{transform:none} .scale span:last-child{transform:translateX(-100%)}
.figs{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.figs b{display:block;font-size:14px;color:var(--fg);font-weight:700}
.actions{display:flex;gap:8px;align-items:center;padding-top:9px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;text-decoration:none;color:var(--fg);background:var(--sunk)}
.btn.primary{background:var(--wine);color:var(--wine-ink)}
.btn.quiet{background:none;color:var(--muted);padding-inline:6px;font-weight:500}
.actions .when{margin-left:auto;font-size:11px;color:var(--muted);text-align:right}
.entry{display:flex;flex-direction:column;gap:8px;background:var(--sunk);border-radius:12px;padding:10px}
.entry .r{display:flex;gap:8px;align-items:center}
.entry input{flex:1;min-width:0;font-family:var(--font-display);font-weight:800;font-size:24px;padding:6px 10px;border-radius:10px;border:1.5px solid var(--wine);background:var(--surface);color:var(--fg)}
.entry .modes{display:flex;gap:6px;font-size:12px}
.entry .modes button{padding:4px 10px;border-radius:999px;color:var(--muted);border:1px solid var(--line)}
.entry .modes button[aria-pressed="true"]{background:var(--surface);color:var(--fg);border-color:var(--fg)}
details.contract{font-size:12.5px}
details.contract summary{cursor:pointer;color:var(--muted);list-style:none}
details.contract summary::-webkit-details-marker{display:none}
details.contract summary::before{content:"＋ ";color:var(--gold)}
details.contract[open] summary::before{content:"− "}
dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.add{align-self:center;color:var(--muted);font-size:13px;padding:10px 18px;border:1px dashed var(--line);border-radius:999px}

/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(20,8,12,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:19px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field span{font-size:11.5px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0;-webkit-appearance:none;appearance:none}
textarea{min-height:120px;font-size:12px!important;font-family:ui-monospace,Menlo,monospace!important}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.danger{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}.sheet{animation:up .22s ease}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%20%3E%0A%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%236b1f3a%22/%3E%0A%3Cpath%20d%3D%22M32%2036%20H68%20C66%2052%2060%2060%2050%2060%20C40%2060%2034%2052%2032%2036%20Z%22%20fill%3D%22%23c9455f%22/%3E%0A%3Cpath%20d%3D%22M30%2022%20H70%20C70%2050%2062%2062%2050%2062%20C38%2062%2030%2050%2030%2022%20Z%22%20fill%3D%22none%22%20stroke%3D%22%23f6e9d7%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22/%3E%0A%3Cpath%20d%3D%22M43%2039%20H54%20L58%2043%20V55%20H43%20Z%22%20fill%3D%22%23f2c94c%22/%3E%0A%3Cpath%20d%3D%22M47%2043%20V51%20M51%2043%20V51%20M45%2047%20H56%22%20stroke%3D%22%238a6a14%22%20stroke-width%3D%221.2%22%20fill%3D%22none%22/%3E%0A%3Cpath%20d%3D%22M50%2062%20V80%20M38%2081%20H62%22%20stroke%3D%22%23f6e9d7%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%0A%3C/svg%3E%0A" alt="">
    <div class="t"><h1>回線ソムリエ</h1><div class="month num" id="monthLabel"></div></div>
    <button class="icon-btn" id="dataBtn" aria-label="バックアップ"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
  </header>
  <div class="month-bar" aria-hidden="true"><i id="monthFill"></i></div>
  <section class="pick" id="pick" aria-live="polite"></section>
  <div class="stats3" id="summary"></div>
  <div class="listhead">
    <h2>本日のリスト</h2>
    <div class="seg" role="group" aria-label="並び順"><button id="sortRec">おすすめ順</button><button id="sortOwn">登録順</button></div>
  </div>
  <div class="note" id="sampleNote" hidden>いまはサンプルの回線が入っています。各回線の「編集」から実際のプランに直してください。</div>
  <div class="list" id="list"></div>
  <button class="add" id="addBtn">＋ 回線を追加</button>
</div>
<div id="sheetRoot"></div>

<script>
const KEY='kaisen-meter-v1';
const CARRIERS={
  rakuten:{name:'楽天モバイル',color:'--c-rakuten',url:'https://portal.mobile.rakuten.co.jp/',hint:'my 楽天モバイル（アプリでも可）'},
  ahamo:{name:'ahamo',color:'--c-ahamo',url:'https://ahamo.com/',hint:'ahamoアプリが一番早い'},
  ymobile:{name:'ワイモバイル',color:'--c-ymobile',url:'https://my.ymobile.jp/',hint:'Wi-Fiオフで自動ログイン'},
  uq:{name:'UQモバイル',color:'--c-uq',url:'https://my.uqmobile.jp/',hint:'My UQ mobileアプリでも可'},
  other:{name:'その他',color:'--c-other',url:'',hint:''}
};
const KAKEHO=['なし（従量）','5分かけ放題','10分かけ放題','かけ放題（無制限）','Rakuten Linkで無料','月60分定額'];
const RAKUTEN_TIERS=[{upTo:3,fee:1078},{upTo:20,fee:2178},{upTo:Infinity,fee:3278}];

const uid=()=>Math.random().toString(36).slice(2,9);
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function sample(){
  const base={num:'',carry:0,start:'',device:'SIMのみ',memo:'',url:'',used:null,usedMonth:'',updatedAt:null,sample:true,kind:'MNP'};
  return [
    {...base,id:uid(),carrier:'rakuten',label:'楽天（例）',plan:'Rakuten最強プラン',cap:null,tiered:true,rollover:false,kakeho:'Rakuten Linkで無料',fee:''},
    {...base,id:uid(),carrier:'ahamo',label:'ahamo ①（例）',plan:'ahamo',cap:30,tiered:false,rollover:false,kakeho:'5分かけ放題',fee:'2970'},
    {...base,id:uid(),carrier:'ahamo',label:'ahamo ②（例）',plan:'ahamo',cap:30,tiered:false,rollover:false,kakeho:'5分かけ放題',fee:'2970'},
    {...base,id:uid(),carrier:'ymobile',label:'ワイモバ（例）',plan:'シンプル3 S',cap:5,tiered:false,rollover:true,kakeho:'なし（従量）',fee:''},
    {...base,id:uid(),carrier:'uq',label:'UQ（例）',plan:'ミニミニプラン',cap:4,tiered:false,rollover:true,kakeho:'なし（従量）',fee:''},
  ];
}
let lines;
try{lines=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){lines=null}
if(!Array.isArray(lines))lines=sample();
lines.forEach(l=>{if(l.rollover===undefined)l.rollover=(l.carrier==='ymobile'||l.carrier==='uq')});
(function migrate(){
  let done=false;try{done=localStorage.getItem(KEY+'-m1')==='1'}catch(e){}
  if(done)return;
  const k=ym(new Date()),now=Date.now();
  let n=0;
  lines.forEach(l=>{
    if(!l.sample)return;
    if(l.carrier==='ahamo'){n++;Object.assign(l,{label:'ahamo '+(n===1?'①':'②'),plan:'ahamo',cap:30,bonus:10,tiered:false,rollover:false,carry:0,kakeho:'5分かけ放題',fee:'2970',memo:'増量おためしキャンペーンで+10GB',used:0,usedMonth:k,updatedAt:now,sample:false})}
    if(l.carrier==='uq'){Object.assign(l,{label:'UQ',plan:'トクトクプラン2',cap:30,bonus:0,tiered:false,rollover:true,carry:24.77,discLine:5,discYen:1100,used:0.23,usedMonth:k,updatedAt:now,sample:false})}
  });
  try{localStorage.setItem(KEY+'-m1','1')}catch(e){}
})();
(function migrate2(){
  let done=false;try{done=localStorage.getItem(KEY+'-m2')==='1'}catch(e){}
  if(done)return;
  lines.forEach(l=>{
    if(l.sample&&l.carrier==='ymobile')Object.assign(l,{label:'ワイモバ',plan:'シンプル3 M',cap:30,bonus:0,tiered:false,rollover:true,carry:23,fee:'2480',memo:'親子割(家族)-1,000円・PayPayカード割-300円ほか適用後',used:24,usedMonth:ym(new Date()),updatedAt:Date.now(),sample:false});
  });
  try{localStorage.setItem(KEY+'-m2','1')}catch(e){}
})();
(function migrate3(){
  let done=false;try{done=localStorage.getItem(KEY+'-m3')==='1'}catch(e){}
  if(done)return;
  lines.forEach(l=>{
    if(l.sample&&l.carrier==='rakuten')Object.assign(l,{label:'楽天',plan:'Rakuten最強プラン',tiered:true,cap:null,rollover:false,carry:0,kakeho:'Rakuten Linkで無料',used:1.01,usedMonth:ym(new Date()),updatedAt:Date.now(),sample:false});
  });
  try{localStorage.setItem(KEY+'-m3','1')}catch(e){}
})();
function save(){try{localStorage.setItem(KEY,JSON.stringify(lines))}catch(e){}}
let sortMode='rec';
try{sortMode=localStorage.getItem(KEY+'-sort')||'rec'}catch(e){}
let openEntry=null, entryMode='used';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*10)/10).toFixed(1);

function monthInfo(){
  const now=new Date();
  const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const frac=(now.getDate()-1+now.getHours()/24+now.getMinutes()/1440)/days;
  const left=days-now.getDate()+1;
  return {now,days,frac:Math.max(frac,0.01),left,key:ym(now)};
}
function usedNow(l,m){return l.usedMonth===m.key&&l.used!=null?l.used:null}
function totalCap(l){return (Number(l.cap)||0)+(Number(l.bonus)||0)+(Number(l.carry)||0)}
function since(ts){
  if(!ts)return '';
  const h=(Date.now()-ts)/36e5;
  if(h<1)return 'さっき更新';
  if(h<24)return Math.floor(h)+'時間前';
  return Math.floor(h/24)+'日前';
}
function analyze(l,m){
  const u=usedNow(l,m);
  const total=l.tiered?null:totalCap(l);
  if(u==null)return {u,total,state:'idle',label:'未入力'};
  const proj=u/m.frac;
  if(l.tiered){
    const t=RAKUTEN_TIERS.findIndex(x=>u<=x.upTo);
    const pt=RAKUTEN_TIERS.findIndex(x=>proj<=x.upTo);
    const next=RAKUTEN_TIERS[t].upTo;
    return {u,total,proj,tier:t,state:pt>t?'warn':'ok',label:pt>t?'段階が上がりそう':'段階内',toNext:isFinite(next)?next-u:null};
  }
  const rem=total-u, perDay=rem/m.left;
  let state='ok',label='余裕あり';
  if(rem<=0){state='bad';label='使い切り'}
  else if(proj>total){state='bad';label='超えそう'}
  else if(proj>total*0.85){state='warn';label='ぎりぎり'}
  else if(!l.rollover&&proj<total*0.6){label='余りそう・使いどき'}
  return {u,total,proj,rem,perDay,state,label};
}
// group 小さいほど先に使う。同 group 内は score 大きいほど先。
function recommend(l,m){
  const entered=usedNow(l,m)!=null;
  const u=entered?usedNow(l,m):0;
  const proj=entered?u/m.frac:0;
  if(l.tiered){
    if(u>20)return {group:1,score:0,short:'使い放題の段階',reason:'20GB超えで最上位の料金。ここから先は使っても料金は同じ'};
    if(u>3)return {group:2,score:20-u,short:'20GBまで同じ料金',reason:`2,178円の段階。20GBまでは料金が変わらない（あと<b>${fmt(20-u)}GB</b>）`};
    return {group:4,score:3-u,short:'温存がお得',reason:`いまは最安の1,078円。あと<b>${fmt(3-u)}GB</b>で+1,100円になるので後回し`};
  }
  const total=totalCap(l), rem=total-u;
  if(Number(l.discLine)>0&&u<=Number(l.discLine)&&rem>0.05){
    const left=Number(l.discLine)-u, yen=Number(l.discYen)||0;
    const vanish=l.rollover?Math.max((Number(l.carry)||0)-u,0):0;
    return {group:4,score:left,short:'割引ライン内で温存',reason:`${fmt(l.discLine)}GB以下なら${yen?yen.toLocaleString()+'円':''}割引。あと<b>${fmt(left)}GB</b>で割引が消えるので後回し${vanish>0.05?`（繰越${fmt(vanish)}GBは月末で消えるが、割引のほうが得）`:''}`};
  }
  if(rem<=0.05)return {group:5,score:0,short:'使い切り',reason:'容量を使い切り。使うと低速になる'};
  if(l.rollover){
    const vanish=Math.max((Number(l.carry)||0)-u,0);
    if(vanish>0.05)return {group:0,score:vanish,short:`繰越${fmt(vanish)}GBが月末で消える`,reason:`繰越分のうち<b>${fmt(vanish)}GB</b>は今月末で消える。先に使う`};
    return {group:3,score:rem,short:'余りは繰り越せる',reason:`余っても翌月に繰り越せるので急がなくていい（残り<b>${fmt(rem)}GB</b>）`};
  }
  const waste=entered?Math.max(total-proj,0):rem;
  if(waste>0.05)return {group:0,score:waste,short:entered?`このままだと${fmt(waste)}GB余る`:`${fmt(rem)}GBが月末で消える`,
    reason:entered?`定額・繰越なし。このペースだと約<b>${fmt(waste)}GB</b>余って消える`:`定額・繰越なし。残り<b>${fmt(rem)}GB</b>は月末で消える`};
  return {group:3,score:rem,short:'ちょうど使い切るペース',reason:`このペースでちょうど使い切る見込み（残り<b>${fmt(rem)}GB</b>）`};
}
function ordered(m){
  const arr=lines.map((l,i)=>({l,i,r:recommend(l,m)}));
  if(sortMode==='rec')arr.sort((a,b)=>a.r.group-b.r.group||b.r.score-a.r.score||a.i-b.i);
  return arr;
}

function render(){
  const m=monthInfo();
  document.getElementById('monthLabel').textContent=`${m.now.getMonth()+1}月 ・ 残り${m.left}日`;
  document.getElementById('monthFill').style.width=Math.round(m.frac*100)+'%';
  document.getElementById('sampleNote').hidden=!lines.some(l=>l.sample);
  const ord=ordered(m);
  const best=[...ord].sort((a,b)=>a.r.group-b.r.group||b.r.score-a.r.score)[0];
  const pick=document.getElementById('pick');
  if(best){
    const c=CARRIERS[best.l.carrier]||CARRIERS.other, url=best.l.url||c.url;
    pick.innerHTML=`<div class="eyebrow">本日の一杯</div><div class="name">${esc(best.l.label)}</div><div class="why">${best.r.reason}</div>
      ${url?`<a class="go" href="${esc(url)}" target="_blank" rel="noopener" data-act="check" data-id="${best.l.id}">使用量を確認 ↗</a>`:''}`;
  }else pick.innerHTML=`<div class="eyebrow">本日の一杯</div><div class="name">回線がありません</div><div class="why">下の「回線を追加」から登録してください</div>`;
  let remSum=0,need=0,stale=0;
  lines.forEach(l=>{const a=analyze(l,m);if(a.rem!=null)remSum+=Math.max(a.rem,0);if(a.state==='warn'||a.state==='bad')need++;if(a.state==='idle'||Date.now()-l.updatedAt>3*864e5)stale++;});
  document.getElementById('summary').innerHTML=`
    <div><b class="num">${fmt(remSum)}<small>GB</small></b><span>残り合計</span></div>
    <div><b class="num" style="color:var(${need?'--warn':'--fg'})">${need}<small>回線</small></b><span>要注意</span></div>
    <div><b class="num">${stale}<small>回線</small></b><span>3日以上未更新</span></div>`;
  document.getElementById('sortRec').setAttribute('aria-pressed',sortMode==='rec');
  document.getElementById('sortOwn').setAttribute('aria-pressed',sortMode!=='rec');
  document.getElementById('list').innerHTML=ord.map((o,k)=>cardHTML(o.l,m,o.r,sortMode==='rec'?k+1:null)).join('');
  if(openEntry){const i=document.getElementById('in-'+openEntry);if(i)i.focus()}
}
function cardHTML(l,m,r,rank){
  const c=CARRIERS[l.carrier]||CARRIERS.other;
  const a=analyze(l,m);
  const url=l.url||c.url;
  const uTxt=a.u==null?'—':fmt(a.u);
  let meter='',figs='',of='';
  if(l.tiered){
    const sc=25,w=a.u==null?0:Math.min(a.u/sc,1)*100;
    of='GB ・ 段階制';
    meter=`<div class="meter"><div class="fill ${a.state==='warn'?'warn':''}" style="width:${w}%"></div><div class="tick" style="left:${3/sc*100}%"></div><div class="tick" style="left:${20/sc*100}%"></div></div>
      <div class="scale num"><span style="left:0">0</span><span style="left:${3/sc*100}%">3GB</span><span style="left:${20/sc*100}%">20GB</span><span style="left:100%">∞</span></div>`;
    if(a.u!=null)figs=`<div>今月の料金<b class="num">${RAKUTEN_TIERS[a.tier].fee.toLocaleString()}円</b></div>${a.toNext!=null?`<div>次の段階まで<b class="num">${fmt(a.toNext)}GB</b></div>`:''}<div>月末予想<b class="num">${fmt(a.proj)}GB</b></div>`;
  }else{
    const w=a.u==null||!a.total?0:Math.min(a.u/a.total,1)*100;
    of=`/ ${fmt(a.total)} GB${[Number(l.bonus)?`増量${fmt(l.bonus)}`:'',Number(l.carry)?`繰越${fmt(l.carry)}`:''].filter(Boolean).length?'（'+[Number(l.bonus)?`増量${fmt(l.bonus)}`:'',Number(l.carry)?`繰越${fmt(l.carry)}`:''].filter(Boolean).join('・')+'含む）':''}`;
    meter=`<div class="meter"><div class="fill ${a.state==='warn'?'warn':a.state==='bad'?'bad':''}" style="width:${w}%"></div>${Number(l.discLine)>0&&a.total?`<div class="tick" style="left:${Math.min(l.discLine/a.total,1)*100}%;background:var(--wine)" title="割引ライン"></div>`:''}<div class="today" style="left:${m.frac*100}%" title="今日"></div></div>`;
    if(a.u!=null)figs=`${Number(l.discLine)>0?`<div>割引ラインまで<b class="num">${a.u<=l.discLine?fmt(l.discLine-a.u)+'GB':'超過'}</b></div>`:''}<div>残り<b class="num">${fmt(Math.max(a.rem,0))}GB</b></div><div>1日あたり<b class="num">${fmt(Math.max(a.perDay,0))}GB</b></div><div>月末予想<b class="num">${fmt(a.proj)}GB</b></div>`;
  }
  const entry=openEntry===l.id?`<form class="entry" data-form="${l.id}">
      ${l.tiered?'':`<div class="modes" role="group" aria-label="入力のしかた"><button type="button" data-act="mode" data-v="used" aria-pressed="${entryMode==='used'}">使った量</button><button type="button" data-act="mode" data-v="rem" aria-pressed="${entryMode==='rem'}">残りの量</button></div>`}
      <div class="r"><input id="in-${l.id}" type="number" inputmode="decimal" step="0.01" min="0" value="${entryMode==='used'&&a.u!=null?a.u:''}" placeholder="${entryMode==='rem'&&!l.tiered?'残り':'使用量'}" aria-label="GB"><span class="of">GB</span>
      <button class="btn primary" type="submit">保存</button><button type="button" class="btn quiet" data-act="cancel">閉じる</button></div>
    </form>`:'';
  const contract=[
    ['プラン',l.plan],['データ',l.tiered?'段階制（〜3GB / 〜20GB / 無制限）':`${l.cap??'-'}GB${Number(l.bonus)?`＋増量${l.bonus}GB`:''} ・ 余りは${l.rollover?'繰越可':'消える'}${Number(l.discLine)>0?` ・ ${l.discLine}GB以下で${Number(l.discYen||0).toLocaleString()}円引き`:''}`],['通話',l.kakeho],
    ['契約',l.kind],['契約日',l.start?`${l.start}（${Math.floor((Date.now()-new Date(l.start))/864e5)}日経過）`:''],
    ['端末',l.device],['月額',l.fee?`${Number(l.fee).toLocaleString()}円`:''],['電話番号',l.num],['確認のコツ',c.hint],['メモ',l.memo]
  ].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  const when=l.usedMonth===m.key?since(l.updatedAt):'';
  return `<article class="card">
    <div class="row1">
      ${rank?`<div class="rank ${rank===1?'first':''}"><small>No.</small>${rank}</div>`:''}
      <div class="who"><div class="n">${esc(l.label)}</div>
        <div class="c"><span class="dot" style="background:var(${c.color})"></span>${c.name} ・ ${esc(l.kakeho)}</div></div>
      <span class="pill ${a.state}">${a.label}</span>
    </div>
    <div class="why">${r.reason}</div>
    <div class="usage"><span class="big num ${a.u==null?'empty':''}">${a.u==null?'<span style="font-size:15px;font-family:var(--font-body);font-weight:500">まだ入力していません</span>':uTxt}</span><span class="of num">${of}</span></div>
    ${meter}
    ${figs?`<div class="figs">${figs}</div>`:''}
    ${entry}
    <div class="actions">
      ${url?`<a class="btn primary" href="${esc(url)}" target="_blank" rel="noopener" data-act="check" data-id="${l.id}">確認 ↗</a>`:''}
      <button class="btn" data-act="entry" data-id="${l.id}">入力</button>
      <button class="btn quiet" data-act="edit" data-id="${l.id}">編集</button>
      <span class="when">${when}</span>
    </div>
    <details class="contract"><summary>契約内容</summary><dl>${contract}</dl></details>
  </article>`;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const id=t.dataset.id,act=t.dataset.act;
  if(act==='check'){openEntry=id;setTimeout(render,50);return}
  if(act==='entry'){openEntry=openEntry===id?null:id;render()}
  if(act==='cancel'){openEntry=null;render()}
  if(act==='mode'){entryMode=t.dataset.v;render()}
  if(act==='edit')openEditor(id);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const id=f.dataset.form,l=lines.find(x=>x.id===id);
  let v=parseFloat(document.getElementById('in-'+id).value);
  if(isNaN(v)||v<0){toast('0以上の数字を入れてください');return}
  if(entryMode==='rem'&&!l.tiered)v=Math.max(totalCap(l)-v,0);
  l.used=Math.round(v*100)/100;l.usedMonth=monthInfo().key;l.updatedAt=Date.now();
  openEntry=null;save();render();toast(`${l.label}：${fmt(l.used)}GB 使用で保存`);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

function toast(msg){
  const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}
function sheet(inner){
  const root=document.getElementById('sheetRoot');
  root.innerHTML=`<div class="sheet-bg" data-close="1">${inner}</div>`;
  root.querySelector('.sheet-bg').addEventListener('click',e=>{if(e.target.dataset.close)root.innerHTML=''});
  return root;
}
function openEditor(id){
  const isNew=!id;
  const l=isNew?{id:uid(),carrier:'ahamo',label:'',num:'',plan:'',cap:30,tiered:false,rollover:false,carry:0,kakeho:KAKEHO[0],kind:'MNP',start:'',device:'SIMのみ',fee:'',memo:'',url:'',used:null,usedMonth:'',updatedAt:null}:lines.find(x=>x.id===id);
  const opt=(arr,v)=>arr.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');
  const root=sheet(`<form class="sheet" id="ed" role="dialog" aria-label="回線の編集"><div class="grab"></div>
    <h2>${isNew?'回線を追加':'回線を編集'}</h2>
    <div class="grid2">
      <label class="field"><span>呼び名</span><input id="f-label" value="${esc(l.label)}" placeholder="例：ahamo サブ"></label>
      <label class="field"><span>キャリア</span><select id="f-carrier">${Object.entries(CARRIERS).map(([k,c])=>`<option value="${k}" ${k===l.carrier?'selected':''}>${c.name}</option>`).join('')}</select></label>
      <label class="field"><span>プラン名</span><input id="f-plan" value="${esc(l.plan)}" placeholder="例：シンプル3 M"></label>
      <label class="field"><span>データの数え方</span><select id="f-tiered"><option value="0" ${!l.tiered?'selected':''}>容量あり</option><option value="1" ${l.tiered?'selected':''}>段階制（楽天）</option></select></label>
      <label class="field"><span>月の容量（GB）</span><input id="f-cap" type="number" step="0.1" min="0" inputmode="decimal" value="${l.cap??''}"></label>
      <label class="field"><span>キャンペーン増量（GB）</span><input id="f-bonus" type="number" step="0.1" min="0" inputmode="decimal" value="${l.bonus||0}"></label>
      <label class="field"><span>割引ライン（GB以下で割引）</span><input id="f-discLine" type="number" step="0.1" min="0" inputmode="decimal" value="${l.discLine||''}" placeholder="なし"></label>
      <label class="field"><span>割引額（円）</span><input id="f-discYen" type="number" min="0" inputmode="numeric" value="${l.discYen||''}" placeholder="例：1100"></label>
      <label class="field"><span>余ったデータ</span><select id="f-rollover"><option value="1" ${l.rollover?'selected':''}>翌月に繰り越せる</option><option value="0" ${!l.rollover?'selected':''}>月末で消える</option></select></label>
      <label class="field"><span>今月の繰越（GB）</span><input id="f-carry" type="number" step="0.1" min="0" inputmode="decimal" value="${l.carry||0}"></label>
      <label class="field"><span>通話</span><select id="f-kakeho">${opt(KAKEHO,l.kakeho)}</select></label>
      <label class="field"><span>契約の種類</span><select id="f-kind">${opt(['MNP','新規','番号移行（同グループ）','機種変更'],l.kind)}</select></label>
      <label class="field"><span>契約日</span><input id="f-start" type="date" value="${esc(l.start)}"></label>
      <label class="field"><span>端末</span><select id="f-device">${opt(['SIMのみ','端末一括','端末分割','返却プログラム'],l.device)}</select></label>
      <label class="field"><span>月額（円）</span><input id="f-fee" type="number" min="0" inputmode="numeric" value="${esc(l.fee)}"></label>
    </div>
    <label class="field"><span>電話番号（末尾だけでも）</span><input id="f-num" value="${esc(l.num)}" placeholder="例：…1234"></label>
    <label class="field"><span>確認ページのURL（空欄ならキャリアの標準ページ）</span><input id="f-url" value="${esc(l.url)}" placeholder="${esc((CARRIERS[l.carrier]||{}).url||'https://')}"></label>
    <label class="field"><span>メモ（維持期間、解約予定日など）</span><input id="f-memo" value="${esc(l.memo)}"></label>
    <div class="row-end">
      ${isNew?'':`<button type="button" class="btn quiet danger" id="delBtn">削除</button><span style="flex:1"></span>`}
      <button type="button" class="btn" data-close="1">閉じる</button><button type="submit" class="btn primary">保存</button>
    </div>
  </form>`);
  const g=k=>document.getElementById('f-'+k);
  const del=document.getElementById('delBtn');
  if(del)del.addEventListener('click',()=>{
    if(del.dataset.armed){lines=lines.filter(x=>x.id!==l.id);save();root.innerHTML='';render();toast('削除しました');return}
    del.dataset.armed='1';del.textContent='もう一度押すと削除';
  });
  document.getElementById('ed').addEventListener('submit',e=>{
    e.preventDefault();
    Object.assign(l,{label:g('label').value.trim()||'無名の回線',carrier:g('carrier').value,plan:g('plan').value.trim(),
      tiered:g('tiered').value==='1',cap:g('cap').value===''?null:parseFloat(g('cap').value),carry:parseFloat(g('carry').value)||0,bonus:parseFloat(g('bonus').value)||0,discLine:parseFloat(g('discLine').value)||0,discYen:parseFloat(g('discYen').value)||0,rollover:g('rollover').value==='1',
      kakeho:g('kakeho').value,num:g('num').value.trim(),kind:g('kind').value,start:g('start').value,device:g('device').value,
      fee:g('fee').value,url:g('url').value.trim(),memo:g('memo').value.trim(),sample:false});
    if(isNew)lines.push(l);
    save();root.innerHTML='';render();toast('保存しました');
  });
}

document.getElementById('addBtn').addEventListener('click',()=>openEditor(null));
const setSort=v=>{sortMode=v;try{localStorage.setItem(KEY+'-sort',v)}catch(e){}render()};
document.getElementById('sortRec').addEventListener('click',()=>setSort('rec'));
document.getElementById('sortOwn').addEventListener('click',()=>setSort('own'));
document.getElementById('dataBtn').addEventListener('click',()=>{
  const root=sheet(`<div class="sheet" role="dialog" aria-label="バックアップ"><div class="grab"></div>
    <h2>バックアップ</h2>
    <div class="why">データはこの端末のブラウザだけに保存されます。機種変更の前などに下の文字をコピーして保管し、戻すときは貼り付けて「読み込む」を押してください。</div>
    <label class="field"><span>バックアップ用の文字</span><textarea id="bk">${esc(JSON.stringify(lines))}</textarea></label>
    <div class="row-end"><button type="button" class="btn quiet" data-close="1">閉じる</button><button type="button" class="btn" id="cpBtn">コピー</button><button type="button" class="btn primary" id="ldBtn">読み込む</button></div>
  </div>`);
  document.getElementById('cpBtn').addEventListener('click',()=>{
    const t=document.getElementById('bk');
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('コピーしました')).catch(()=>{t.select();toast('選択しました。長押しでコピーしてください')});
  });
  document.getElementById('ldBtn').addEventListener('click',()=>{
    try{const d=JSON.parse(document.getElementById('bk').value);if(!Array.isArray(d))throw 0;lines=d;save();root.innerHTML='';render();toast('読み込みました')}
    catch(e){toast('形式が違います。コピーした文字をそのまま貼ってください')}
  });
});
render();
</script>

</body>
</html>
