<style>
/* Layout: 1カラムの回線カード列。各カードに「使用量メーター＋今日の位置マーカー」 */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#1b2430; --muted:#5f6b7a; --line:#dbe1e8;
  --accent:#1f6f8b; --accent-ink:#ffffff; --track:#e6ebf0;
  --ok:#2e8b57; --warn:#c7881a; --bad:#c2413b;
  --c-rakuten:#b8336a; --c-ahamo:#3a9a5a; --c-ymobile:#d14b4b; --c-uq:#2b7bc0; --c-other:#7a8796;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-num:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3642;
  --accent:#5fb3cf; --accent-ink:#0d1a20; --track:#26303b;
  --ok:#5cc28a; --warn:#e3a943; --bad:#ec6f68;
  --c-rakuten:#e06a9a; --c-ahamo:#6cc68a; --c-ymobile:#ec7b7b; --c-uq:#6aaee6; --c-other:#9aa6b4;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --fg:#e4e9ef; --muted:#9aa6b4; --line:#2c3642;
  --accent:#5fb3cf; --accent-ink:#0d1a20; --track:#26303b;
  --ok:#5cc28a; --warn:#e3a943; --bad:#ec6f68;
  --c-rakuten:#e06a9a; --c-ahamo:#6cc68a; --c-ymobile:#ec7b7b; --c-uq:#6aaee6; --c-other:#9aa6b4;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:7px 12px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.summary div{background:var(--surface);padding:10px 12px;min-width:0}
.summary b{display:block;font-size:20px}
.summary span{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.note{font-size:13px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.name{font-weight:700;font-size:16px;min-width:0;overflow-wrap:anywhere}
.carrier{font-size:12px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.chip.k{color:var(--fg)}
.usage{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.usage .big{font-size:28px;font-weight:700;line-height:1;background:none;border:none;padding:0;border-bottom:2px dotted var(--line);border-radius:0}
.usage .of{color:var(--muted)}
.meter{position:relative;height:12px;background:var(--track);border-radius:6px;overflow:visible}
.fill{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--ok)}
.fill.warn{background:var(--warn)} .fill.bad{background:var(--bad)}
.today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:1px}
.today::after{content:"今日";position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}
.tiers{position:absolute;top:0;bottom:0;width:1px;background:var(--surface)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted)}
.stats b{color:var(--fg);font-weight:500}
.status{font-size:12.5px;font-weight:700}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)} .status.idle{color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions a.check{display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:10px;padding:7px 14px}
.updated{margin-left:auto;font-size:12px;color:var(--muted)}
.entry{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.entry input{width:7.5em;font-size:20px;padding:6px 10px;border-radius:10px;border:1px solid var(--accent);background:var(--bg);color:var(--fg)}
.entry label{font-size:13px;color:var(--muted)}
details.contract{font-size:13px;border-top:1px solid var(--line);padding-top:8px}
details.contract summary{cursor:pointer;color:var(--muted)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0}
dt{color:var(--muted)} dd{margin:0;min-width:0;overflow-wrap:anywhere}
.foot{display:flex;gap:8px;flex-wrap:wrap}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px 24px;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}.summary b{font-size:17px}}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field span{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%;min-width:0}
textarea{min-height:120px;font-family:var(--font-num);font-size:12px}
.row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.danger{color:var(--bad);border-color:var(--bad);background:transparent}
.rank{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-family:var(--font-num);font-weight:700;font-size:14px;background:var(--track);color:var(--muted)}
.rank.first{background:var(--accent);color:var(--accent-ink)}
.reason{font-size:13px;border-left:3px solid var(--line);padding:2px 0 2px 10px;color:var(--fg)}
.reason.g0,.reason.g1{border-color:var(--accent)} .reason.g4{border-color:var(--warn)} .reason.g5{border-color:var(--bad)}
.pick{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;font-size:14px}
.pick b{font-size:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:6px 10px;font-size:13px;background:var(--surface);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style>

  <header>
    <div>
      <h1 style="display:flex;align-items:center;gap:10px"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%20%3E%0A%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%236b1f3a%22/%3E%0A%3Cpath%20d%3D%22M32%2036%20H68%20C66%2052%2060%2060%2050%2060%20C40%2060%2034%2052%2032%2036%20Z%22%20fill%3D%22%23c9455f%22/%3E%0A%3Cpath%20d%3D%22M30%2022%20H70%20C70%2050%2062%2062%2050%2062%20C38%2062%2030%2050%2030%2022%20Z%22%20fill%3D%22none%22%20stroke%3D%22%23f6e9d7%22%20stroke-width%3D%223%22%20stroke-linejoin%3D%22round%22/%3E%0A%3Cpath%20d%3D%22M43%2039%20H54%20L58%2043%20V55%20H43%20Z%22%20fill%3D%22%23f2c94c%22/%3E%0A%3Cpath%20d%3D%22M47%2043%20V51%20M51%2043%20V51%20M45%2047%20H56%22%20stroke%3D%22%238a6a14%22%20stroke-width%3D%221.2%22%20fill%3D%22none%22/%3E%0A%3Cpath%20d%3D%22M50%2062%20V80%20M38%2081%20H62%22%20stroke%3D%22%23f6e9d7%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22%20fill%3D%22none%22/%3E%0A%3C/svg%3E%0A" alt="" width="32" height="32" style="border-radius:8px">回線ソムリエ</h1>
      <div class="sub" id="monthLabel"></div>
    </div>
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <div class="seg" role="group" aria-label="並び順"><button id="sortRec">おすすめ順</button><button id="sortOwn">登録順</button></div>
      <button class="btn-ghost" id="dataBtn">バックアップ</button>
    </div>
  </header>
  <div class="pick" id="pick"></div>
  <div class="summary" id="summary"></div>
  <div class="note" id="sampleNote" hidden>最初はサンプル値が入っています。各回線の「編集」から実際のプラン・契約内容に直してください。</div>
  <div id="list" class="wrap" style="gap:12px"></div>
  <div class="foot"><button id="addBtn">＋ 回線を追加</button></div>
</div>
<div id="sheetRoot"></div>

<script>
const KEY='kaisen-meter-v1';
const CARRIERS={
  rakuten:{name:'楽天モバイル',color:'--c-rakuten',url:'https://portal.mobile.rakuten.co.jp/',hint:'my 楽天モバイル（アプリでも可）'},
  ahamo:{name:'ahamo',color:'--c-ahamo',url:'https://ahamo.com/',hint:'ahamoアプリが一番早い'},
  ymobile:{name:'ワイモバイル',color:'--c-ymobile',url:'https://my.ymobile.jp/',hint:'Wi-Fiオフで自動ログイン'},
  uq:{name:'UQモバイル',color:'--c-uq',url:'https://my.uqmobile.jp/',hint:'My UQ mobileアプリでも可'},
  other:{name:'その他',color:'--c-other',url:'',hint:''}
};
const KAKEHO=['なし（従量）','5分かけ放題','10分かけ放題','かけ放題（無制限）','Rakuten Linkで無料','月60分定額'];
const RAKUTEN_TIERS=[{upTo:3,fee:1078},{upTo:20,fee:2178},{upTo:Infinity,fee:3278}];

const uid=()=>Math.random().toString(36).slice(2,9);
const ym=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
function sample(){
  return [
    {id:uid(),carrier:'rakuten',label:'楽天（例）',num:'',plan:'Rakuten最強プラン',cap:null,tiered:true,carry:0,kakeho:'Rakuten Linkで無料',kind:'MNP',start:'',device:'SIMのみ',fee:'',memo:'',url:'',used:null,usedMonth:'',updatedAt:null,sample:true},
    {id:uid(),carrier:'ahamo',label:'ahamo ①（例）',num:'',plan:'ahamo',cap:30,tiered:false,carry:0,kakeho:'5分かけ放題',kind:'MNP',start:'',device:'SIMのみ',fee:'2970',memo:'',url:'',used:null,usedMonth:'',updatedAt:null,sample:true},
    {id:uid(),carrier:'ahamo',label:'ahamo ②（例）',num:'',plan:'ahamo',cap:30,tiered:false,carry:0,kakeho:'5分かけ放題',kind:'MNP',start:'',device:'SIMのみ',fee:'2970',memo:'',url:'',used:null,usedMonth:'',updatedAt:null,sample:true},
    {id:uid(),carrier:'ymobile',label:'ワイモバ（例）',num:'',plan:'シンプル3 S',cap:5,tiered:false,carry:0,kakeho:'なし（従量）',kind:'MNP',start:'',device:'SIMのみ',fee:'',memo:'',url:'',used:null,usedMonth:'',updatedAt:null,sample:true},
    {id:uid(),carrier:'uq',label:'UQ（例）',num:'',plan:'ミニミニプラン',cap:4,tiered:false,carry:0,kakeho:'なし（従量）',kind:'MNP',start:'',device:'SIMのみ',fee:'',memo:'',url:'',used:null,usedMonth:'',updatedAt:null,sample:true},
  ];
}
let lines;
try{lines=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){lines=null}
if(!Array.isArray(lines))lines=sample();
lines.forEach(l=>{if(l.rollover===undefined)l.rollover=(l.carrier==='ymobile'||l.carrier==='uq')});
function save(){try{localStorage.setItem(KEY,JSON.stringify(lines))}catch(e){}}
let sortMode='rec';
try{sortMode=localStorage.getItem(KEY+'-sort')||'rec'}catch(e){}

// おすすめ度：group が小さいほど先に使う。同じ group 内は score が大きいほど先。
// 0 使わないと月末に消える分がある / 1 楽天20GB超（使い放題で料金同じ）/ 2 楽天3〜20GB（20GBまで料金同じ）
// 3 定額だが余りは繰り越せる / 4 楽天3GB以下（超えると+1,100円）/ 5 使い切り
function recommend(l,m){
  const entered=usedNow(l,m)!=null;
  const u=entered?usedNow(l,m):0;
  const proj=entered?u/m.frac:0;
  const note=entered?'':'（今月未入力のため0GBとして計算）';
  if(l.tiered){
    if(u>20)return {group:1,score:0,reason:'20GBを超えて最上位の料金に到達済み。ここから先はいくら使っても料金は同じ'};
    if(u>3)return {group:2,score:20-u,reason:`今は2,178円の段階。20GBまでは使っても料金は同じ（あと${fmt(20-u)}GB）`};
    return {group:4,score:3-u,reason:`今は最安の1,078円。あと${fmt(3-u)}GB使うと+1,100円になるので後回し`+note};
  }
  const total=(Number(l.cap)||0)+(Number(l.carry)||0);
  const rem=total-u;
  if(rem<=0.05)return {group:5,score:0,reason:'容量を使い切り。使うと低速になる'};
  if(l.rollover){
    const vanish=Math.max((Number(l.carry)||0)-u,0); // 繰越分から先に減る
    if(vanish>0.05)return {group:0,score:vanish,reason:`繰越分のうち${fmt(vanish)}GBは今月末で消える。先にここを使う`+note};
    return {group:3,score:rem,reason:`余った分は翌月に繰り越せるので急がなくていい（残り${fmt(rem)}GB）`+note};
  }
  const waste=entered?Math.max(total-proj,0):rem;
  if(waste>0.05)return {group:0,score:waste,reason:`定額で繰り越しなし。${entered?`このペースだと約${fmt(waste)}GB余って消える`:`残り${fmt(rem)}GBは月末で消える`}`+note};
  return {group:3,score:rem,reason:`このペースでちょうど使い切る見込み。これ以上は増やさない（残り${fmt(rem)}GB）`};
}
function ordered(m){
  const arr=lines.map((l,i)=>({l,i,r:recommend(l,m)}));
  if(sortMode==='rec')arr.sort((a,b)=>a.r.group-b.r.group||b.r.score-a.r.score||a.i-b.i);
  return arr;
}

let openEntry=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*10)/10).toFixed(1);

function monthInfo(){
  const now=new Date();
  const days=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  const frac=(now.getDate()-1+now.getHours()/24+now.getMinutes()/1440)/days;
  const left=days-now.getDate()+1;
  return {now,days,frac:Math.max(frac,0.01),left,key:ym(now)};
}
function usedNow(l,m){return l.usedMonth===m.key&&l.used!=null?l.used:null}
function since(ts){
  if(!ts)return '未入力';
  const h=(Date.now()-ts)/36e5;
  if(h<1)return 'さっき更新';
  if(h<24)return Math.floor(h)+'時間前に更新';
  return Math.floor(h/24)+'日前に更新';
}
function analyze(l,m){
  const u=usedNow(l,m);
  const total=l.tiered?null:(Number(l.cap)||0)+(Number(l.carry)||0);
  if(u==null)return {u,total,state:'idle',label:'今月まだ未入力'};
  const proj=u/m.frac;
  if(l.tiered){
    const t=RAKUTEN_TIERS.findIndex(x=>u<=x.upTo);
    const pt=RAKUTEN_TIERS.findIndex(x=>proj<=x.upTo);
    const state=pt>t?'warn':'ok';
    const next=RAKUTEN_TIERS[t].upTo;
    return {u,total,proj,tier:t,state,label:state==='warn'?'このペースだと料金段階が上がりそう':'今の料金段階に収まるペース',toNext:isFinite(next)?next-u:null};
  }
  const rem=total-u;
  const perDay=rem/m.left;
  let state='ok',label='ペースは余裕あり';
  if(rem<=0){state='bad';label='容量を使い切りました'}
  else if(proj>total){state='bad';label='このペースだと月末前に超えます'}
  else if(proj>total*0.85){state='warn';label='月末ぎりぎりのペース'}
  return {u,total,proj,rem,perDay,state,label};
}

function render(){
  const m=monthInfo();
  document.getElementById('monthLabel').textContent=`${m.now.getMonth()+1}月 ・ 残り${m.left}日（${Math.round(m.frac*100)}%経過）`;
  document.getElementById('sampleNote').hidden=!lines.some(l=>l.sample);
  // summary
  let remSum=0,need=0,stale=0;
  lines.forEach(l=>{const a=analyze(l,m);if(a.rem!=null)remSum+=Math.max(a.rem,0);if(a.state==='warn'||a.state==='bad')need++;if(!l.updatedAt||Date.now()-l.updatedAt>3*864e5||a.state==='idle')stale++;});
  document.getElementById('summary').innerHTML=`
    <div><b class="num">${fmt(remSum)}<small style="font-size:12px"> GB</small></b><span>容量ありの回線 残り合計</span></div>
    <div><b class="num" style="color:var(${need?'--warn':'--ok'})">${need}</b><span>注意が必要な回線</span></div>
    <div><b class="num">${stale}</b><span>3日以上未更新</span></div>`;
  const ord=ordered(m);
  const best=[...ord].sort((a,b)=>a.r.group-b.r.group||b.r.score-a.r.score)[0];
  document.getElementById('pick').innerHTML=best?`本日のおすすめは <b>${esc(best.l.label)}</b><div class="sub" style="margin-top:2px">${esc(best.r.reason)}</div>`:'回線を追加してください';
  document.getElementById('sortRec').setAttribute('aria-pressed',sortMode==='rec');
  document.getElementById('sortOwn').setAttribute('aria-pressed',sortMode!=='rec');
  const list=document.getElementById('list');
  list.innerHTML=ord.map((o,k)=>cardHTML(o.l,m,o.r,sortMode==='rec'?k+1:null)).join('');
  if(openEntry){const i=document.getElementById('in-'+openEntry);if(i){i.focus();i.select()}}
}
function cardHTML(l,m,r,rank){
  const c=CARRIERS[l.carrier]||CARRIERS.other;
  const a=analyze(l,m);
  const url=l.url||c.url;
  let meter='',usage='',stats='';
  const uTxt=a.u==null?'—':fmt(a.u);
  if(l.tiered){
    const scale=25; // 0〜25GB表示、20GB超は振り切り
    const w=a.u==null?0:Math.min(a.u/scale,1)*100;
    meter=`<div class="meter" aria-hidden="true"><div class="fill ${a.state==='warn'?'warn':''}" style="width:${w}%"></div>
      <div class="tiers" style="left:${3/scale*100}%"></div><div class="tiers" style="left:${20/scale*100}%"></div></div>
      <div class="stats num" style="font-size:11px;justify-content:space-between"><span>0</span><span style="margin-left:${3/scale*100-6}%">3GB</span><span>20GB</span><span>無制限</span></div>`;
    usage=`<button class="big num" data-act="entry" data-id="${l.id}" aria-label="使用量を入力">${uTxt}</button><span class="of">GB 使用 ・ 段階制</span>`;
    if(a.u!=null)stats=`<span>今の料金 <b class="num">${RAKUTEN_TIERS[a.tier].fee.toLocaleString()}円</b></span>${a.toNext!=null?`<span>次の段階まで <b class="num">${fmt(a.toNext)}GB</b></span>`:''}<span>月末予想 <b class="num">${fmt(a.proj)}GB</b></span>`;
  }else{
    const w=a.u==null||!a.total?0:Math.min(a.u/a.total,1)*100;
    meter=`<div class="meter" aria-hidden="true"><div class="fill ${a.state==='warn'?'warn':a.state==='bad'?'bad':''}" style="width:${w}%"></div><div class="today" style="left:${m.frac*100}%"></div></div>`;
    usage=`<button class="big num" data-act="entry" data-id="${l.id}" aria-label="使用量を入力">${uTxt}</button><span class="of num">/ ${fmt(a.total)} GB</span>${Number(l.carry)?`<span class="chip">繰越 ${fmt(l.carry)}GB 含む</span>`:''}`;
    if(a.u!=null)stats=`<span>残り <b class="num">${fmt(Math.max(a.rem,0))}GB</b></span><span>1日あたり <b class="num">${fmt(Math.max(a.perDay,0))}GB</b></span><span>月末予想 <b class="num">${fmt(a.proj)}GB</b></span>`;
  }
  const entry=openEntry===l.id?`<form class="entry" data-form="${l.id}">
      <label for="in-${l.id}">今月の使用量</label>
      <input id="in-${l.id}" class="num" type="number" inputmode="decimal" step="0.01" min="0" value="${a.u??''}" placeholder="0.00">
      <span class="of">GB</span><button class="btn-primary" type="submit">保存</button><button type="button" class="btn-ghost" data-act="cancel">やめる</button>
      ${l.tiered?'':`<label style="width:100%;font-size:12px">残量しか表示されない時は「残り◯GB」→ <button type="button" data-act="fromrem" data-id="${l.id}" style="padding:2px 8px;font-size:12px">残量で入力</button></label>`}
    </form>`:'';
  const contract=[
    ['プラン',l.plan],['データ',l.tiered?'段階制（〜3GB / 〜20GB / 無制限）':`${l.cap??'-'}GB`],['通話',l.kakeho],
    ['契約',l.kind],['開始日',l.start?`${l.start}（${Math.floor((Date.now()-new Date(l.start))/864e5)}日経過）`:''],
    ['端末',l.device],['月額',l.fee?`${Number(l.fee).toLocaleString()}円`:''],['電話番号',l.num],['メモ',l.memo]
  ].filter(x=>x[1]).map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
  return `<article class="card">
    <div class="top">${rank?`<span class="rank ${rank===1?'first':''}" aria-label="おすすめ${rank}位">${rank}</span>`:''}<span class="dot" style="background:var(${c.color})"></span>
      <div class="grow"><div class="name">${esc(l.label)}</div><div class="carrier">${c.name}${l.num?' ・ '+esc(l.num):''}</div></div>
      <span class="status ${a.state}">${a.label}</span></div>
    <div class="chips"><span class="chip k">${esc(l.plan||'プラン未設定')}</span><span class="chip k">${esc(l.kakeho)}</span><span class="chip">${esc(l.kind)}${l.device?' ・ '+esc(l.device):''}</span></div>
    <div class="reason g${r.group}">${esc(r.reason)}</div>
    <div class="usage">${usage}</div>
    ${meter}
    ${stats?`<div class="stats">${stats}</div>`:''}
    ${entry}
    <div class="actions">
      ${url?`<a class="check" href="${esc(url)}" target="_blank" rel="noopener" data-act="check" data-id="${l.id}">確認 ↗</a>`:''}
      <button data-act="entry" data-id="${l.id}">入力</button>
      <button class="btn-ghost" data-act="edit" data-id="${l.id}">編集</button>
      <span class="updated">${a.u==null&&l.updatedAt?'先月の値のみ':since(l.usedMonth===m.key?l.updatedAt:null)}</span>
    </div>
    ${c.hint?`<div class="sub" style="font-size:12px;margin-top:-4px">${c.hint}</div>`:''}
    <details class="contract"><summary>契約内容</summary><dl>${contract}</dl></details>
  </article>`;
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const id=t.dataset.id,act=t.dataset.act;
  if(act==='check'){openEntry=id;setTimeout(render,50);return} // リンクはそのまま開く
  if(act==='entry'){openEntry=openEntry===id?null:id;render()}
  if(act==='cancel'){openEntry=null;render()}
  if(act==='edit')openEditor(id);
  if(act==='fromrem'){
    const l=lines.find(x=>x.id===id);const inp=document.getElementById('in-'+id);
    const total=(Number(l.cap)||0)+(Number(l.carry)||0);
    const v=parseFloat(inp.value);if(isNaN(v)){toast('先に残量の数字を入れてから押してください');return}
    inp.value=fmt(Math.max(total-v,0));toast(`残り${v}GB → 使用 ${inp.value}GB に変換しました`);
  }
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const id=f.dataset.form,l=lines.find(x=>x.id===id);
  const v=parseFloat(document.getElementById('in-'+id).value);
  if(isNaN(v)||v<0){toast('0以上の数字を入れてください');return}
  l.used=v;l.usedMonth=monthInfo().key;l.updatedAt=Date.now();
  openEntry=null;save();render();toast(`${l.label}：${fmt(v)}GB で保存しました`);
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

function toast(msg){
  const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);
  setTimeout(()=>d.remove(),2200);
}

function openEditor(id){
  const isNew=!id;
  const l=isNew?{id:uid(),carrier:'ahamo',label:'',num:'',plan:'',cap:30,tiered:false,carry:0,kakeho:KAKEHO[0],kind:'MNP',start:'',device:'SIMのみ',fee:'',memo:'',url:'',used:null,usedMonth:'',updatedAt:null}:lines.find(x=>x.id===id);
  const opt=(arr,v)=>arr.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('');
  const root=document.getElementById('sheetRoot');
  root.innerHTML=`<div class="sheet-bg" data-close="1"><form class="sheet" id="ed" role="dialog" aria-label="回線の編集">
    <h2>${isNew?'回線を追加':'回線を編集'}</h2>
    <div class="grid2">
      <label class="field"><span>呼び名</span><input id="f-label" value="${esc(l.label)}" placeholder="例：ahamo サブ" required></label>
      <label class="field"><span>キャリア</span><select id="f-carrier">${Object.entries(CARRIERS).map(([k,c])=>`<option value="${k}" ${k===l.carrier?'selected':''}>${c.name}</option>`).join('')}</select></label>
      <label class="field"><span>プラン名</span><input id="f-plan" value="${esc(l.plan)}" placeholder="例：シンプル3 M"></label>
      <label class="field"><span>データの数え方</span><select id="f-tiered"><option value="0" ${!l.tiered?'selected':''}>容量あり（GB上限）</option><option value="1" ${l.tiered?'selected':''}>段階制（楽天の最強プラン）</option></select></label>
      <label class="field"><span>月の容量（GB）</span><input id="f-cap" type="number" step="0.1" min="0" inputmode="decimal" value="${l.cap??''}"></label>
      <label class="field"><span>余ったデータ</span><select id="f-rollover"><option value="1" ${l.rollover?'selected':''}>翌月に繰り越せる</option><option value="0" ${!l.rollover?'selected':''}>月末で消える</option></select></label>
      <label class="field"><span>今月の繰越（GB）</span><input id="f-carry" type="number" step="0.1" min="0" inputmode="decimal" value="${l.carry||0}"></label>
      <label class="field"><span>通話</span><select id="f-kakeho">${opt(KAKEHO,l.kakeho)}</select></label>
      <label class="field"><span>電話番号（末尾だけでも）</span><input id="f-num" value="${esc(l.num)}" placeholder="例：…1234"></label>
      <label class="field"><span>契約の種類</span><select id="f-kind">${opt(['MNP','新規','番号移行（同グループ）','機種変更'],l.kind)}</select></label>
      <label class="field"><span>契約日</span><input id="f-start" type="date" value="${esc(l.start)}"></label>
      <label class="field"><span>端末</span><select id="f-device">${opt(['SIMのみ','端末一括','端末分割','返却プログラム'],l.device)}</select></label>
      <label class="field"><span>月額（円）</span><input id="f-fee" type="number" min="0" inputmode="numeric" value="${esc(l.fee)}"></label>
    </div>
    <label class="field"><span>確認ページのURL（空欄ならキャリアの標準ページ）</span><input id="f-url" value="${esc(l.url)}" placeholder="${esc((CARRIERS[l.carrier]||{}).url||'https://')}"></label>
    <label class="field"><span>メモ（維持期間、解約予定日など）</span><input id="f-memo" value="${esc(l.memo)}"></label>
    <div class="row-end">
      ${isNew?'':`<button type="button" class="danger" id="delBtn">削除</button><span style="flex:1"></span>`}
      <button type="button" data-close="1">閉じる</button><button type="submit" class="btn-primary">保存</button>
    </div>
  </form></div>`;
  const g=k=>document.getElementById('f-'+k);
  root.querySelector('.sheet-bg').addEventListener('click',e=>{if(e.target.dataset.close)root.innerHTML=''});
  const del=document.getElementById('delBtn');
  if(del)del.addEventListener('click',()=>{
    if(del.dataset.armed){lines=lines.filter(x=>x.id!==l.id);save();root.innerHTML='';render();toast('削除しました');return}
    del.dataset.armed='1';del.textContent='本当に削除する';
  });
  document.getElementById('ed').addEventListener('submit',e=>{
    e.preventDefault();
    Object.assign(l,{label:g('label').value.trim()||'無名の回線',carrier:g('carrier').value,plan:g('plan').value.trim(),
      tiered:g('tiered').value==='1',cap:g('cap').value===''?null:parseFloat(g('cap').value),carry:parseFloat(g('carry').value)||0,rollover:g('rollover').value==='1',
      kakeho:g('kakeho').value,num:g('num').value.trim(),kind:g('kind').value,start:g('start').value,device:g('device').value,
      fee:g('fee').value,url:g('url').value.trim(),memo:g('memo').value.trim(),sample:false});
    if(isNew)lines.push(l);
    save();root.innerHTML='';render();toast('保存しました');
  });
  g('label').focus();
}

document.getElementById('addBtn').addEventListener('click',()=>openEditor(null));
const setSort=v=>{sortMode=v;try{localStorage.setItem(KEY+'-sort',v)}catch(e){}render()};
document.getElementById('sortRec').addEventListener('click',()=>setSort('rec'));
document.getElementById('sortOwn').addEventListener('click',()=>setSort('own'));
document.getElementById('dataBtn').addEventListener('click',()=>{
  const root=document.getElementById('sheetRoot');
  root.innerHTML=`<div class="sheet-bg" data-close="1"><div class="sheet" role="dialog" aria-label="バックアップ">
    <h2>バックアップ</h2>
    <div class="sub">データはこの端末のブラウザだけに保存されます。機種変更の前などに下の文字をコピーして保管し、戻すときは貼り付けて「読み込む」。</div>
    <textarea id="bk">${esc(JSON.stringify(lines))}</textarea>
    <div class="row-end"><button type="button" data-close="1">閉じる</button><button type="button" id="cpBtn">コピー</button><button type="button" class="btn-primary" id="ldBtn">読み込む</button></div>
  </div></div>`;
  root.querySelector('.sheet-bg').addEventListener('click',e=>{if(e.target.dataset.close)root.innerHTML=''});
  document.getElementById('cpBtn').addEventListener('click',()=>{
    const t=document.getElementById('bk');
    (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>toast('コピーしました')).catch(()=>{t.select();toast('選択しました。長押しでコピーしてください')});
  });
  document.getElementById('ldBtn').addEventListener('click',()=>{
    try{const d=JSON.parse(document.getElementById('bk').value);if(!Array.isArray(d))throw 0;lines=d;save();root.innerHTML='';render();toast('読み込みました')}
    catch(e){toast('形式が違います。コピーした文字をそのまま貼ってください')}
  });
});
render();
</script>
